# Layout and style cops for generated Ruby client code.
# Cop settings match RuboCop 1.88 defaults unless noted below.
AllCops:
  # TargetRubyVersion omitted so RuboCop uses the Ruby interpreter running the command.
  DisabledByDefault: true
  NewCops: disable
  Exclude:
    - '**/vendor/**/*'

Style/AndOr:
  Enabled: true
  EnforcedStyle: conditionals
  SafeAutoCorrect: false

Layout/CaseIndentation:
  Enabled: true
  EnforcedStyle: case
  IndentOneStep: false

Layout/CommentIndentation:
  Enabled: true
  AllowForAlignment: false

Layout/ElseAlignment:
  Enabled: true

Layout/EmptyLineAfterMagicComment:
  Enabled: true

Layout/EmptyLinesAroundClassBody:
  Enabled: true
  EnforcedStyle: no_empty_lines

Layout/EmptyLinesAroundMethodBody:
  Enabled: true

Layout/EmptyLinesAroundModuleBody:
  Enabled: true
  EnforcedStyle: no_empty_lines

Layout/FirstArgumentIndentation:
  Enabled: true
  EnforcedStyle: special_for_inner_method_call_in_parentheses

Style/HashSyntax:
  Enabled: false

Layout/IndentationConsistency:
  Enabled: true
  EnforcedStyle: indented_internal_methods

Layout/IndentationWidth:
  Enabled: true
  Width: 2
  EnforcedStyleAlignWith: start_of_line
  AllowedPatterns: []

Layout/LeadingCommentSpace:
  Enabled: true
  AllowDoxygenCommentStyle: false
  AllowGemfileRubyComment: false
  AllowRBSInlineAnnotation: false
  AllowSteepAnnotation: false

Layout/SpaceAfterColon:
  Enabled: true

Layout/SpaceAfterComma:
  Enabled: true

Layout/SpaceAroundEqualsInParameterDefault:
  Enabled: true
  EnforcedStyle: space

Layout/SpaceAroundKeyword:
  Enabled: true

Layout/SpaceAroundOperators:
  Enabled: true
  AllowForAlignment: true
  EnforcedStyleForExponentOperator: no_space
  EnforcedStyleForRationalLiterals: no_space

Layout/SpaceBeforeComma:
  Enabled: true

Layout/SpaceBeforeFirstArg:
  Enabled: true
  AllowForAlignment: true

Style/DefWithParentheses:
  Enabled: true

Style/MethodDefParentheses:
  Enabled: true
  EnforcedStyle: require_parentheses

Style/FrozenStringLiteralComment:
  Enabled: false

Layout/SpaceBeforeBlockBraces:
  Enabled: true
  EnforcedStyle: space
  EnforcedStyleForEmptyBraces: space

Layout/SpaceInsideBlockBraces:
  Enabled: true
  EnforcedStyle: space
  EnforcedStyleForEmptyBraces: no_space
  SpaceBeforeBlockParameters: true

Layout/SpaceInsideHashLiteralBraces:
  Enabled: true
  EnforcedStyle: space
  EnforcedStyleForEmptyBraces: no_space

Layout/SpaceInsideParens:
  Enabled: true
  EnforcedStyle: no_space

Layout/IndentationStyle:
  Enabled: true
  EnforcedStyle: spaces

Layout/TrailingEmptyLines:
  Enabled: true
  EnforcedStyle: final_newline

Layout/TrailingWhitespace:
  Enabled: false
  AllowInHeredoc: false

Style/RedundantPercentQ:
  Enabled: true

Layout/EndAlignment:
  Enabled: true
  EnforcedStyleAlignWith: variable
  AutoCorrect: contextual
  Severity: warning

Lint/RequireParentheses:
  Enabled: true

Style/RedundantReturn:
  Enabled: true
  AllowMultipleReturnValues: true

Style/Semicolon:
  Enabled: true
  AllowAsExpressionSeparator: true
